name: Publish Profession Reagents package

on:
  push:
    branches: [main]
    paths:
      - 'packages/ProfessionReagents/*.zip'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Verify the installable ZIP
        id: addon
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $toc = Get-Content -LiteralPath 'addons/ProfessionReagents/src/ProfessionReagents.toc'
          $version = ($toc | Select-String '^## Version: (\d+\.\d+\.\d+)$').Matches.Groups[1].Value
          if (!$version) { throw 'Missing Profession Reagents version' }
          $filename = "ProfessionReagents-$version.zip"
          New-Item -ItemType Directory -Path 'dist' -Force | Out-Null
          Copy-Item -LiteralPath "packages/ProfessionReagents/$filename" -Destination 'dist/'
          ./scripts/package.ps1 -Addon ProfessionReagents -Verify
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1.2.4
        with:
          version: '1.3.0'
      - name: Publish to GitHub Packages
        working-directory: packages/ProfessionReagents
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.addon.outputs.version }}
        run: |
          printf '%s' "$GHCR_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          oras push "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/profession-reagents:$VERSION" \
            --artifact-type application/zip \
            --annotation "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --annotation "org.opencontainers.image.description=Installable ZIP for Profession Reagents on World of Warcraft: Forever" \
            --annotation "org.opencontainers.image.version=$VERSION" \
            "ProfessionReagents-$VERSION.zip:application/zip"
